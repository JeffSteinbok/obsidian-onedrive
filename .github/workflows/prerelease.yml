name: Release Automation - Beta Pre-Release (patch-beta / minor-beta / major-beta)

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Beta version bump type'
        required: true
        type: choice
        options:
          - patch-beta
          - minor-beta
          - major-beta
        default: patch-beta

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx vitest run

  prerelease:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0  # Fetch all history for merging

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Merge triggering branch (if not main)
        id: merge
        run: |
          TRIGGER_BRANCH="${{ github.ref_name }}"
          echo "Triggered from: $TRIGGER_BRANCH"
          echo "trigger_branch=$TRIGGER_BRANCH" >> $GITHUB_OUTPUT

          if [[ "$TRIGGER_BRANCH" != "main" ]]; then
            echo "Merging $TRIGGER_BRANCH into main for build..."
            git fetch origin "$TRIGGER_BRANCH"
            git merge --no-commit --no-ff "origin/$TRIGGER_BRANCH" || {
              echo "::error::Merge conflict - please merge $TRIGGER_BRANCH into main first"
              exit 1
            }
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "Already on main, no merge needed"
            echo "merged=false" >> $GITHUB_OUTPUT
          fi

      - run: npm ci

      - name: Bump beta version
        id: bump
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_type }}"

          # Read current beta version from manifest-beta.json
          CURRENT=$(node -p "require('./manifest-beta.json').version")
          echo "Current beta version: $CURRENT"

          # Parse the current version components
          # Expected format: X.Y.Z-beta.N or X.Y.Z (if first beta)
          STABLE_VERSION=$(node -p "require('./manifest.json').version")

          if [[ "$BUMP_TYPE" == "minor-beta" ]]; then
            # Bump minor from stable, start beta.0
            NEW_VERSION=$(node -p "
              const [major, minor] = '$STABLE_VERSION'.split('.');
              major + '.' + (parseInt(minor)+1) + '.0-beta.0'
            ")
          elif [[ "$BUMP_TYPE" == "major-beta" ]]; then
            # Bump major from stable, start beta.0
            NEW_VERSION=$(node -p "
              const [major] = '$STABLE_VERSION'.split('.');
              (parseInt(major)+1) + '.0.0-beta.0'
            ")
          else
            # Increment beta number if ahead of stable, otherwise start beta.0 from next patch
            NEW_VERSION=$(node -p "
              const stable = '$STABLE_VERSION';
              const current = '$CURRENT';
              const betaMatch = current.match(/^(.+)-beta\.(\d+)$/);
              const betaBase = betaMatch ? betaMatch[1] : current;
              const compareParts = (a, b) => {
                const pa = a.split('.').map(Number);
                const pb = b.split('.').map(Number);
                for (let i = 0; i < 3; i++) {
                  if (pa[i] > pb[i]) return 1;
                  if (pa[i] < pb[i]) return -1;
                }
                return 0;
              };
              if (betaMatch && compareParts(betaBase, stable) > 0) {
                betaMatch[1] + '-beta.' + (parseInt(betaMatch[2])+1);
              } else {
                const [major, minor, patch] = stable.split('.');
                major + '.' + minor + '.' + (parseInt(patch)+1) + '-beta.0';
              }
            ")
          fi

          echo "New beta version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Update manifest-beta.json only
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest-beta.json', 'utf8'));
            m.version = '$NEW_VERSION';
            fs.writeFileSync('manifest-beta.json', JSON.stringify(m, null, '\t') + '\n');
          "

      - name: Build
        run: npm run build

      - name: Prepare beta manifest for release
        run: cp manifest-beta.json manifest.json

      - name: Commit version bump to main
        run: |
          # Reset merge changes, keep only manifest-beta.json update
          if [[ "${{ steps.merge.outputs.merged }}" == "true" ]]; then
            # We merged a branch - reset to main, then apply only manifest-beta.json change
            git reset --hard origin/main
            # Re-apply the version bump
            node -e "
              const fs = require('fs');
              const m = JSON.parse(fs.readFileSync('manifest-beta.json', 'utf8'));
              m.version = '${{ steps.bump.outputs.version }}';
              fs.writeFileSync('manifest-beta.json', JSON.stringify(m, null, '\t') + '\n');
            "
          fi

          git add manifest-beta.json
          git commit -m "Beta pre-release ${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.version }}"
          git push origin main
          git push origin --tags

      - name: Rebuild with merged code for release artifacts
        if: steps.merge.outputs.merged == 'true'
        run: |
          # Merge the branch again for building release artifacts
          git merge --no-commit --no-ff "origin/${{ steps.merge.outputs.trigger_branch }}"
          npm ci
          npm run build
          cp manifest-beta.json manifest.json

      - name: Attest build artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          name: "Beta ${{ steps.bump.outputs.version }}"
          prerelease: true
          generate_release_notes: true
          body: |
            ${{ steps.merge.outputs.merged == 'true' && format('Built from branch: `{0}`', steps.merge.outputs.trigger_branch) || 'Built from `main`' }}
          files: |
            main.js
            manifest.json
            styles.css
