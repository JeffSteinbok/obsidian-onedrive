name: Publish Postmortem Writeup

# The Copilot coding agent cannot reliably comment on a *separate* tracking issue
# (cross-resource write needs manual approval). Instead, it puts the 5-Whys writeup
# in its hardening PR body between markers. This workflow reads that writeup and
# posts/updates it as a comment on the `Closes #<issue>` tracking issue, using a
# PAT with issues:write so no human intervention is needed.
#
# Uses `pull_request_target` (not `pull_request`) so the run is NOT subject to the
# manual "approve workflows" gate that applies to PRs authored by the Copilot
# coding agent — otherwise this would need the same manual approval it exists to
# remove. It runs from the trusted base branch and only READS the PR body via the
# API (never checks out PR head code), so the elevated-trust context is safe.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Hardening PR number to publish the writeup from'
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  publish:
    # Only postmortem hardening PRs (agent branches or the documented convention).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.pull_request.head.ref, 'postmortem/') ||
      startsWith(github.event.pull_request.head.ref, 'copilot/postmortem')
    runs-on: ubuntu-latest
    steps:
      - name: Mirror writeup to tracking issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // ---- Resolve the hardening PR (event payload or dispatch input) ----
            let pr;
            if (context.eventName === 'workflow_dispatch') {
              const num = parseInt('${{ inputs.pr_number }}', 10);
              ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: num }));
            } else {
              pr = context.payload.pull_request;
            }

            const body = pr.body || '';

            // ---- Extract the marked 5-Whys writeup ----
            const m = body.match(
              /<!--\s*postmortem-writeup:start\s*-->\s*([\s\S]*?)\s*<!--\s*postmortem-writeup:end\s*-->/i
            );
            if (!m) {
              core.info(`PR #${pr.number} has no postmortem-writeup markers. Nothing to publish.`);
              return;
            }
            const writeup = m[1].trim();
            if (!writeup) {
              core.warning(`PR #${pr.number} writeup markers are empty. Skipping.`);
              return;
            }

            // ---- Find the tracking issue this PR closes ----
            const closesMatch = body.match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (!closesMatch) {
              core.warning(`PR #${pr.number} has no "Closes #<issue>" reference. Cannot locate tracking issue.`);
              return;
            }
            const issueNumber = parseInt(closesMatch[1], 10);

            // ---- Idempotency: one managed comment per hardening PR ----
            const marker = `<!-- postmortem-comment:pr-${pr.number} -->`;
            const commentBody = [
              marker,
              writeup,
              ``,
              `_Published automatically from #${pr.number} by \`.github/workflows/postmortem-publish.yml\`._`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });
            const existing = comments.find(c => (c.body || '').includes(marker));

            if (existing) {
              if ((existing.body || '').trim() === commentBody.trim()) {
                core.info(`Tracking issue #${issueNumber} comment already up to date. No change.`);
                return;
              }
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: commentBody,
              });
              core.info(`Updated postmortem comment on issue #${issueNumber} for PR #${pr.number}.`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber, body: commentBody,
              });
              core.info(`Posted postmortem comment on issue #${issueNumber} for PR #${pr.number}.`);
            }
