name: Puppets

on:
  schedule:
    - cron: "10 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report intended mutations without applying them
        required: false
        default: false
        type: boolean

concurrency:
  group: puppets-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  copilot-requests: write

jobs:
  reconcile:
    uses: JeffSteinbok/puppets/.github/workflows/reconcile.yml@1788658a6c8c7aabb136194519985e4ce1d6968f
    with:
      framework_ref: 1788658a6c8c7aabb136194519985e4ce1d6968f
      dry_run: ${{ inputs.dry_run || false }}
      caller_workflow: puppets.yml
    secrets:
      token: ${{ secrets.PAT_TOKEN }}
