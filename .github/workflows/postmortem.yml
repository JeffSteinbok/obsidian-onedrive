name: Bug-Fix Postmortem

# When a bug-fix PR is merged, open a tracking issue for the Puppets postmortem profile.
# A trusted maintainer approves the issue before Puppets assigns the coding agent.
#
# Can also be dispatched manually for a specific PR (backfill / re-run).

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run the postmortem for'
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  postmortem:
    # For the PR-merge trigger: only merged PRs, never postmortem PRs (no loops).
    # The workflow_dispatch path always runs (guarded inside the script).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       !startsWith(github.event.pull_request.head.ref, 'postmortem/') &&
       !contains(github.event.pull_request.labels.*.name, 'postmortem'))
    runs-on: ubuntu-latest
    steps:
      - name: Open postmortem issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // ---- Resolve the target PR (event payload or dispatch input) ----
            let pr;
            if (context.eventName === 'workflow_dispatch') {
              const num = parseInt('${{ inputs.pr_number }}', 10);
              const { data } = await github.rest.pulls.get({ owner, repo, pull_number: num });
              pr = data;
              pr.labels = data.labels || [];
            } else {
              pr = context.payload.pull_request;
            }

            const body = pr.body || '';
            const labels = (pr.labels || []).map(l => (typeof l === 'string' ? l : l.name));

            // ---- Qualify: is this a bug fix? ----
            // Only inspect the "Type of Change" section so prose / quoted
            // templates elsewhere in the body can't cause false positives.
            const hasBugLabel = labels.includes('bug');
            const typeSection = (body.match(/##\s*Type of Change([\s\S]*?)(?=\n##\s|$)/i) || [, ''])[1];
            const bugFixChecked = /-\s*\[x\]\s*Bug fix/i.test(typeSection);
            if (!hasBugLabel && !bugFixChecked) {
              core.info(`PR #${pr.number} is not a bug fix (no 'bug' label, Bug fix unchecked). Skipping.`);
              return;
            }
            core.info(`PR #${pr.number} qualifies (bugLabel=${hasBugLabel}, bugFixChecked=${bugFixChecked}).`);

            // ---- Avoid duplicate postmortem issues for the same PR ----
            const marker = `<!-- postmortem:pr-${pr.number} -->`;
            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} in:body "${marker}" type:issue`,
            });
            if (existing.data.total_count > 0) {
              core.info(`Postmortem issue already exists for PR #${pr.number}. Skipping.`);
              return;
            }

            // ---- Ensure process labels exist ----
            const processLabels = [
              {
                name: 'postmortem',
                color: '5319e7',
                description: 'Automated 5-Whys postmortem for a merged bug fix',
              },
            ];
            for (const label of processLabels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              }
            }

            // ---- Find a linked issue this PR fixed (best effort) ----
            const closesMatch = body.match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            const linkedIssue = closesMatch ? closesMatch[1] : null;

            // ---- Create the tracking issue ----
            const issueBody = [
              marker,
              `A bug-fix PR was merged. Run the postmortem skill to find the root cause and harden the system.`,
              ``,
              `**Fixing PR:** #${pr.number} — ${pr.title}`,
              `**Merge commit:** ${pr.merge_commit_sha || '(see PR)'}`,
              linkedIssue ? `**Original bug issue:** #${linkedIssue}` : `**Original bug issue:** (none linked)`,
              ``,
              `---`,
              ``,
              `Apply \`puppets:approved\` after reviewing this tracking issue. Puppets will`,
              `then assign the coding agent using \`.puppets/prompts/postmortem.md\`.`,
              ``,
              `_Automated by \`.github/workflows/postmortem.yml\`._`,
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner, repo,
              title: `Postmortem: PR #${pr.number} — ${pr.title}`,
              body: issueBody,
              labels: ['postmortem'],
            });
            core.info(`Created postmortem issue #${issue.number}.`);

            // ---- Link back from the PR (best-effort; don't fail the job) ----
            const note =
              `🔬 Opened postmortem #${issue.number}. Review it and apply ` +
              `\`puppets:approved\` to start the 5-Whys analysis and hardening work.`;
            try {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body: note,
              });
            } catch (e) {
              core.warning(`Could not comment on PR #${pr.number} (needs Pull requests: write): ${e.message}`);
            }
