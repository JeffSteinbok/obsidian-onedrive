spec:
  profiles:
    # Implement approved issues with Claude Code (subscription via CLAUDE_CODE_OAUTH_TOKEN)
    # instead of the Copilot coding agent. Curation and acceptance review remain Copilot.
    - name: basic
      implementation:
        provider: claude
    - name: postmortem
      default: false
      priority: 100
      selector:
        allLabels:
          - postmortem
      routes:
        approved: claim
      implementation:
        prompt: postmortem
        guidance: null
        heading: Puppets postmortem instructions
        provider: claude
